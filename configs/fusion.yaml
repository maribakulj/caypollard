protocol: protocol-v0.3
method: validation_minmax_late_fusion
alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
normalization:
  method: validation_random_pair_minmax
  sample_pairs: 20000
  seed: 42
alpha_selection:
  metric: mean_ndcg_at_10
  split: validation
  tie_break: higher_visual_weight
reranking:
  candidate_k: 100
evaluation_k: [1, 5, 10]
