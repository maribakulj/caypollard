name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --extra dev --extra alignment
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -q
      - name: Execute research notebooks
        run: |
          uv run jupyter nbconvert --to notebook --execute notebooks/00_project_overview.ipynb --output /tmp/00_project_overview.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/01_iconclass_graph.ipynb --output /tmp/01_iconclass_graph.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/02_visual_embeddings.ipynb --output /tmp/02_visual_embeddings.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/03_kg_embeddings.ipynb --output /tmp/03_kg_embeddings.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/04_visual_retrieval_baseline.ipynb --output /tmp/04_visual_retrieval_baseline.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/05_graph_retrieval_baseline.ipynb --output /tmp/05_graph_retrieval_baseline.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/06_multimodal_fusion.ipynb --output /tmp/06_multimodal_fusion.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/06b_learned_joint_alignment.ipynb --output /tmp/06b_learned_joint_alignment.executed.ipynb --ExecutePreprocessor.timeout=120
          uv run jupyter nbconvert --to notebook --execute notebooks/07_hard_pairs_evaluation.ipynb --output /tmp/07_hard_pairs_evaluation.executed.ipynb --ExecutePreprocessor.timeout=120
