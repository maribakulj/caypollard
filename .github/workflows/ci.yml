name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path: lint, unit tests, and every notebook that runs from repository
  # fixtures alone. No heavyweight model dependencies.
  test:
    name: Lint, tests, fixture notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -q
      - name: Execute fixture notebooks
        run: make notebooks

  # Slow path: the learned-alignment condition needs PyTorch, so it is kept out
  # of the fast job rather than charged to every push.
  alignment:
    name: Learned-alignment notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --extra dev --extra alignment
      - name: Test
        run: uv run pytest -q
      - name: Execute alignment notebook
        run: make notebooks-alignment
