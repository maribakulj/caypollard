[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caypollard"
version = "0.4.0"
description = "Reproducible experiments on image, knowledge-graph, and multimodal embeddings for cultural heritage retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2",
  "pytest>=8.0",
  "ruff>=0.16,<0.17",
]
vision = [
  "torch>=2.4",
  "transformers>=4.44",
  "open-clip-torch>=2.26",
  "pillow>=10.4",
]
retrieval = [
  "faiss-cpu>=1.8",
]
alignment = [
  "torch>=2.4",
]
graph = [
  "pykeen>=1.11,<1.12",
  "networkx>=3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/caypollard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly so the rule set is a property of the project rather than
# of whichever ruff release CI happens to resolve. The dev extra pins ruff to a
# minor series for the same reason.
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
